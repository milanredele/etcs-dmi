# Builds the DMI and the EVC simulator to WebAssembly, cross-checks the
# rendering against the golden frames and publishes the browser test
# bench (test/wasm) on GitHub Pages.
#
# One-time repository setup: Settings > Pages > Source: "GitHub Actions".
# Deployments from a branch other than the default one also need that
# branch allowed under Settings > Environments > github-pages.
name: Browser test bench

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # GNAT-LLVM + AdaWebPack toolchain image, cached between runs
      - uses: docker/setup-buildx-action@v4
      - name: Toolchain image
        uses: docker/build-push-action@v7
        with:
          context: test/wasm
          platforms: linux/amd64
          tags: etcs-dmi-wasm
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build dmi.wasm and evc.wasm
        run: test/wasm/build.sh

      - name: Cross-check the wasm rendering against the golden frames
        run: node test/wasm/smoke.js

      - name: Assemble the site
        run: test/wasm/site.sh _site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
