<!DOCTYPE HTML>
<html>
  <head>
    <style>
      body {
        margin: 0px;
        padding: 0px;
      }
    </style>
  </head>
	<div id="controls" style="padding: 10px; font-family: sans-serif;">
		<h3>DMI Parameters</h3>
		<div>
			<label>Speed (0..400): <input type="number" id="speed" value="136" min="0" max="400" oninput="sendParams()"></label>
			<label>Vperm: <input type="number" id="vperm" value="120" min="0" max="400" oninput="sendParams()"></label>
			<label>Vtarget: <input type="number" id="vtarget" value="80" min="0" max="400" oninput="sendParams()"></label>
			<label>Vrelease: <input type="number" id="vrelease" value="35" min="0" max="400" oninput="sendParams()"></label>
			<label>Dist (0..90000): <input type="number" id="dist" value="684" min="0" max="90000" oninput="sendParams()"></label>
			<label>Range: 
				<select id="range" onchange="sendParams()">
					<option value="0">140</option>
					<option value="1" selected>180</option>
					<option value="2">250</option>
					<option value="3">400</option>
				</select>
			</label>
		</div>
	</div>
    <canvas id="myCanvas" width="640" height="480"></canvas>
	<script>
		function sendParams() {
			const params = {
				speed: parseInt(document.getElementById('speed').value),
				vperm: parseInt(document.getElementById('vperm').value),
				vtarget: parseInt(document.getElementById('vtarget').value),
				vrelease: parseInt(document.getElementById('vrelease').value),
				dist: parseInt(document.getElementById('dist').value),
				range: parseInt(document.getElementById('range').value),
				mode: 2, // Default to M_FS (index 2 in Mode_T)
				flash_enable: true,
				vrelease_exists: true,
				show_taf: true
			};
			socket.send(JSON.stringify(params));
			console.log('Sent params:', params);
		}

		var canvas = document.getElementById('myCanvas');
		var context = canvas.getContext('2d');
		const canWidth = canvas.width;
		const canHeight = canvas.height;
		var img = context.createImageData(canWidth, canHeight);
		
		var socket = new WebSocket('ws://127.0.0.1:8080');
		socket.binaryType = 'arraybuffer';
		
		var colorMap = 
		[
			[255, 255, 255], //WHITE
			[0  , 0  , 0  ], //BLACK
			[195, 195, 195], //GREY
			[150, 150, 150], //MEDIUM_GREY
			[85 , 85 , 85 ], //DARK_GREY
			[3  , 17 , 34 ], //DARK_BLUE
			[8  , 24 , 57 ], //SHADOW
			[223, 223, 0  ], //YELLOW
			[234, 145, 0  ], //ORANGE
			[191, 0  , 2  ], //RED
			[33 , 49 , 74 ], //PASP_DARK
			[41 , 74 , 107], //PASP_LIGHT
		];
		
		// image area is coming in chunks so need to do some hekk
		var pos_x = 0;
		var pos_y = 0;
		var width = 0;
		var height = 0;		
		var areaBuf;
		var offset = -8; // 0 at the beginning of image data, so starts at -8 at the beginning of message header
		
		socket.onmessage = function (e) {
			var data = e.data;
			var dv = new DataView(data);
			var buf = new Uint8Array(data);
			var dataOffset = 0;
			
			while (dataOffset < buf.length){
			
				if (offset === -8) {
					pos_x = dv.getInt16(dataOffset, true);
					offset += 2;
					dataOffset += 2;
				}
				if (offset === -6 && dataOffset < buf.length) {
					pos_y = dv.getInt16(dataOffset, true);
					offset += 2;
					dataOffset += 2;
				}
				if (offset === -4 && dataOffset < buf.length) {
					width = dv.getInt16(dataOffset, true);
					offset += 2;
					dataOffset += 2;
				}
				if (offset === -2 && dataOffset < buf.length) {
					height = dv.getInt16(dataOffset, true);
					offset += 2;
					dataOffset += 2;
					console.log('We have width: ' + width + 'px, height: ' + height + 'px, pos_x: ' + pos_x + ' pos_y: ' + pos_y);
				}
				if (offset === 0 && dataOffset < buf.length) {
					areaBuf = new Uint8Array(width * height);
				}
				
				for (var i=0; (i+offset)<areaBuf.length && (i+dataOffset)<buf.length; i++){
					areaBuf[i + offset] = buf[i + dataOffset];
				}
				offset += i;
				dataOffset += i; 
				
				if (areaBuf.length <= offset){
					// we have it all
					for (let j=0; j<height; j++){
						for (let i=0; i<width; i++){
							let imgIdx = 4 * (pos_x + i + (pos_y + j) * canWidth);
							let bufIdx = i + j * width;
							let color = colorMap[areaBuf[bufIdx]];
							img.data[imgIdx] = color[0];
							img.data[imgIdx+1] = color[1];
							img.data[imgIdx+2] = color[2];
							img.data[imgIdx+3] = 255;
						}
					}
					context.putImageData(img, 0, 0);
					console.log ('Image put');
					offset = -8;
				}
			}
		};
	</script>
</body>
