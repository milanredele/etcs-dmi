# The ERTMS/ETCS language, SUBSET-026 v4.0.0 chapter 7 (variables and
# packets) and chapter 8 (radio messages), as data. Format: SCHEMA.md.
#
# Read from SUBSET-026-7_v400.pdf and SUBSET-026-8_v400.pdf (page numbers
# in the comments are PDF pages), not from the markdown: the markdown
# flattens the packet tables (indentation = condition, suffixes (k), (n),
# (k,m) = loop). check_catalogue.py validates this file against SCHEMA.md
# and cross-checks every packet against the markdown tables.
#
# Values: min, max and special are raw values (what is on the wire), not
# physical ones; the physical unit is in scale or resolution. For variables
# whose every value is listed in 7.5 (qualifiers, M_ codes), special lists
# all defined values and max is the highest one; spare values are
# omitted. "infinite" stands for the symbol the PDF prints for infinity.

# ---------------------------------------------------------------------
# Variables, 7.5 (7.5.0.x and 7.5.1.x as numbered in the PDF)
# ---------------------------------------------------------------------

